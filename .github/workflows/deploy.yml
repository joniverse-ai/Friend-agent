# Actions 안에서 Dockerfile로 이미지를 만들고, 커밋 번호를 태그로 붙여 Artifact Registry에 올린 뒤 그 이미지로 배포한다.
# 사용법: deploy-envs.yml 의 deploy 작업을 이 파일의 내용으로 바꾼다(테스트, 환경, 승인 구조는 그대로).
#   저장소 공통 Variables 에 AR_REPO(예: us-central1-docker.pkg.dev/<프로젝트 ID>/friend-agent) 를 추가한다.
#   배포용 서비스 계정에 Artifact Registry 저장소 하나에 대한 쓰기 권한(roles/artifactregistry.writer)을 추가한다(docs/wif-setup.md 5단계).
# 배포용 이미지는 여기서만 만든다. 노트북에서 만든 이미지는 CPU 종류가 다를 수 있고, 누가 언제 만들었는지 기록이 남지 않는다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGING_SERVICE: friend-agent-staging
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name != 'main'
        run: |
          IMAGE="${{ vars.AR_REPO }}/friend-agent:${{ github.sha }}"
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REV=$(gcloud run services describe "$STAGING_SERVICE" --region us-central1 --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          gcloud run revisions describe "$REV" --region us-central1 --format json > rev.json
          echo "IMAGE=$(jq -r '.status.imageDigest' rev.json)" >> "$GITHUB_ENV"
          echo "COMMIT=$(jq -r '.spec.containers[0].env[] | select(.name=="COMMIT_SHA") | .value' rev.json)" >> "$GITHUB_ENV"
          echo "staging 리비전 $REV 의 이미지를 승격한다"

      # 블루그린 1단계: 새 리비전을 트래픽 0% 로 올리고 green 태그를 붙인다. 사용자는 아직 이전 리비전을 쓴다.
      # green 은 서비스 안에서 하나뿐이라, 배포할 때마다 이전 리비전에서 떼어 새 리비전으로 옮겨 간다.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE }}
          env_vars: |
            COMMIT_SHA=${{ env.COMMIT }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }} --startup-probe=httpGet.path=/health,periodSeconds=5,failureThreshold=12,timeoutSeconds=2
          no_traffic: true
          tag: green

      # 블루그린 2단계: 서비스 주소가 아니라 태그 URL 로 새 리비전만 확인한다(서비스 주소는 아직 이전 리비전이 답한다).
      # /health 가 정상이고 /version 의 커밋이 이번 커밋이어야 통과. 끝까지 안 되면 실패로 끝나 전환 단계로 가지 않는다.
      - name: 스모크 테스트 (태그 URL)
        run: |
          TAG_URL=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '.status.traffic[] | select(.tag=="green") | .url')
          echo "확인할 주소 $TAG_URL, 기대하는 커밋 $COMMIT"
          for i in $(seq 1 12); do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$TAG_URL/health" || true)
            GOT=$(curl -s --max-time 5 "$TAG_URL/version" | jq -r '.commit // empty' || true)
            echo "$i번째: /health $HEALTH, commit ${GOT:-없음}"
            if [ "$HEALTH" = "200" ] && [ "$GOT" = "$COMMIT" ]; then echo "스모크 테스트 통과"; exit 0; fi
            sleep 5
          done
          echo "::error::스모크 테스트 실패. 트래픽을 옮기지 않는다"
          exit 1

      # 블루그린 3단계: 트래픽 100% 를 가장 최근 리비전(방금 확인한 새 리비전)으로 옮긴다.
      # 특정 리비전이 아니라 --to-latest 로 옮겨야 트래픽이 고정되지 않아, 다음 배포의 0% 단계가 꼬이지 않는다.
      - name: 전환 (새 리비전으로 100%)
        run: |
          BEFORE=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '[.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)%"] | join(", ")')
          echo "전환 전 트래픽(롤백할 곳) $BEFORE"
          gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --to-latest
          AFTER=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --format json | jq -r '[.status.traffic[] | select(.percent > 0) | "\(.revisionName)=\(.percent)%"] | join(", ")')
          echo "전환 후 트래픽 $AFTER"
          echo "### 배포 기록" >> "$GITHUB_STEP_SUMMARY"
          echo "- 전환 전(롤백할 곳): \`$BEFORE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 전환 후: \`$AFTER\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 커밋: \`$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 배포 결과
        run: |
          echo "배포된 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $IMAGE"
